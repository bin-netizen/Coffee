<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Test Coffee Bean 3D</title>
  <style>
    body {
      margin: 0;
      background: #F5E6D3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    /* Container chiếm ~1/3 bố cục trang, không full màn hình */
    #hero3d {
      width: 33%;
      min-width: 320px;
      height: 450px;
    }
  </style>
</head>
<body>
  <div id="hero3d"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('hero3d');
    const MODEL_PATH = '/models/coffee_bean.glb';

    // ===== Scene, camera, renderer =====
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 5); // khoảng cách cố định - vì model sẽ được chuẩn hóa scale bên dưới

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // ===== Lights =====
    const ambient = new THREE.AmbientLight(0xffffff, 1.0);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
    dirLight.position.set(3, 5, 4);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 1.0);
    fillLight.position.set(-3, 2, -4);
    scene.add(fillLight);

    // ===== Controls =====
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = false;

    // ===== Load model =====
    let beanModel = null;
    const loader = new GLTFLoader();
    const TARGET_SIZE = 2.5; // kích thước mong muốn sau khi chuẩn hóa (đơn vị Three.js, không liên quan đơn vị gốc model)

    loader.load(
      MODEL_PATH,
      (gltf) => {
        beanModel = gltf.scene;

        // Bước 1: đo kích thước gốc thật của model (dù đơn vị gốc lớn/nhỏ bất thường)
        const box = new THREE.Box3().setFromObject(beanModel);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);

        // Bước 2: chuẩn hóa scale về kích thước cố định TARGET_SIZE
        // -> không cần biết đơn vị gốc là gì, luôn ra kết quả nhất quán
        const scaleFactor = TARGET_SIZE / maxDim;
        beanModel.scale.setScalar(scaleFactor);

        // Bước 3: căn giữa model về gốc tọa độ (áp dụng scale trước khi trừ center)
        beanModel.position.sub(center.multiplyScalar(scaleFactor));

        scene.add(beanModel);
        console.log('Model loaded thành công. Kích thước gốc:', size, '- Scale áp dụng:', scaleFactor);
      },
      (progress) => {
        console.log('Đang tải:', (progress.loaded / progress.total * 100).toFixed(0) + '%');
      },
      (error) => {
        console.error('Lỗi load model 3D:', error);
        container.innerHTML = '<img src="/img/coffee_bean-fallback.png" alt="Coffee bean" style="width:100%;height:100%;object-fit:contain;" />';
      }
    );

    // ===== Animate loop =====
    let isVisible = true;
    document.addEventListener('visibilitychange', () => {
      isVisible = document.visibilityState === 'visible';
    });

    function animate() {
      requestAnimationFrame(animate);
      if (!isVisible) return;
      if (beanModel) {
        beanModel.rotation.y += 0.004;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // ===== Resize handling =====
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
